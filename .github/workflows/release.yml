# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: fertige Binaries an einem Tag v*.
#
# Warum überhaupt fertige Binaries: Der ASA-Monitor ist ein Crowd-Projekt, und
# die Hürde, an der Freiwillige abspringen, ist nicht die Konfiguration,
# sondern der Satz "übersetze dir zuerst welle.io" (docs/ausrollen.md).
#
# Der Lauf liefert zweierlei:
#
#   * `.tar.gz` mit **asamon-node** für vier Plattformen — statisch, ohne
#     Laufzeitabhängigkeiten, alle von einem Rechner cross-gebaut.
#   * `.deb` mit **beiden Programmen** für Raspberry Pi OS und Debian. Das ist
#     der Weg, den install.sh geht: `asamon-rx` linkt dynamisch gegen fünf
#     Bibliotheken, und ein Paket lässt apt sie holen, statt sie in einer
#     Anleitung aufzuzählen.
#
# Je Debian-Fassung ein eigenes Paket. Das ist keine Bequemlichkeit: Mit
# Debian 13 sind Bibliotheken auf 64-bit-Zeitstempel umgestellt und heißen
# anders (libmpg123-0 → libmpg123-0t64), und die glibc-Untergrenze eines
# Binaries gilt ohnehin nur aufwärts. Ein Paket für beide gäbe es nur um den
# Preis erfundener Abhängigkeiten.
#
# GPL-3.0-or-later: Binärweitergabe verpflichtet zur Quellweitergabe. Sie ist
# dadurch erfüllt, dass dieses Repo öffentlich ist und der Tag darauf zeigt —
# QUELLEN.txt nennt Tag und Commits ausdrücklich, damit das nicht von der
# Erinnerung abhängt.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne führendes v, etwa 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  # --- asamon-node: vier Plattformen von einem Rechner ------------------------
  asamon-node:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.wert }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Für die Commit-Angabe in QUELLEN.txt und im --version der Binary.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: asamon-node/go.mod
          check-latest: true

      - name: Version bestimmen
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "wert=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Erst prüfen, dann ausliefern. Ein Release aus ungeprüftem Stand ist
      # schlimmer als kein Release.
      - name: Tests
        working-directory: asamon-node
        run: go test ./... -timeout 900s

      - name: Archive bauen
        working-directory: asamon-node
        run: make dist VERSION=${{ steps.version.outputs.wert }}

      - name: QUELLEN.txt
        working-directory: asamon-node
        run: |
          welle=$(git ls-tree HEAD ../asamon-rx/external/welle.io | awk '{print $3}')
          cat > dist/QUELLEN.txt <<EOF
          asa-monitor ${{ steps.version.outputs.wert }}
            Quelle:   ${{ github.server_url }}/${{ github.repository }}
            Tag:      ${GITHUB_REF_NAME:-(kein Tag)}
            Commit:   ${GITHUB_SHA}
            Lizenz:   GPL-3.0-or-later

          asamon-rx linkt statisch gegen libwelle aus dem welle.io-Fork:
            welle.io: https://github.com/josch0/welle.io (Zweig asa-fig0-15)
            Commit:   ${welle:-unbekannt}
            Lizenz:   GPL-2.0-or-later
          Gebaut ohne FDK-AAC; dessen Lizenz gilt als GPL-unvertraeglich.
          Dynamisch gelinkt gegen FFTW3f, FAAD2, mpg123, librtlsdr und LAME
          aus den Systempaketen der jeweiligen Debian-Fassung.
          EOF
          cat dist/QUELLEN.txt

      # Die cross-gebauten Binaries gehen an die .deb-Jobs. Damit braucht dort
      # niemand eine Go-Toolchain im Container — asamon-node ist statisch, es
      # ist gleich, wo es gebaut wurde.
      - uses: actions/upload-artifact@v4
        with:
          name: node-binaries
          path: asamon-node/build/asamon-node-linux-*
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: node-archive
          path: |
            asamon-node/dist/*.tar.gz
            asamon-node/dist/QUELLEN.txt

  # --- .deb: je Architektur und Debian-Fassung eines ---------------------------
  deb:
    needs: asamon-node
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.basis }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 nativ — GitHub bietet dafür Runner an, keine Emulation.
          - { arch: arm64, runner: ubuntu-24.04-arm, basis: bookworm, kurz: deb12 }
          - { arch: arm64, runner: ubuntu-24.04-arm, basis: trixie,   kurz: deb13 }
          - { arch: amd64, runner: ubuntu-24.04,     basis: bookworm, kurz: deb12 }
          - { arch: amd64, runner: ubuntu-24.04,     basis: trixie,   kurz: deb13 }
          # armhf fehlt: kein nativer Runner, und über QEMU dauert ein
          # welle.io-Bau über eine Stunde. Wer 32-bit-Pi-OS fährt, baut selbst
          # (asamon-rx/README.md) — Raspberry Pi OS ist seit 2022 64-bittig.
    steps:
      - name: Bauabhängigkeiten
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates \
            dpkg-dev fakeroot \
            libfftw3-dev libfaad-dev libmpg123-dev librtlsdr-dev libmp3lame-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Der Container läuft als root, der Checkout gehört einem anderen Nutzer.
      # Ohne das lehnt git jede Abfrage im Arbeitsbaum ab.
      - name: Arbeitsbaum freigeben
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@v4
        with:
          name: node-binaries
          path: node-binaries

      - name: asamon-rx bauen
        run: |
          cmake -B build/deb -S asamon-rx -DCMAKE_BUILD_TYPE=Release
          cmake --build build/deb -j"$(nproc)"

      # Ohne SDR-Stick, aber mit allem, was ohne einen auskommt. Ein Paket aus
      # ungeprüftem Bau wäre der falsche Sparsamkeit.
      - name: Tests
        run: ctest --test-dir build/deb --output-on-failure

      - name: Paket bauen
        run: |
          chmod +x node-binaries/asamon-node-linux-${{ matrix.arch }}
          sh packaging/build-deb.sh \
            --version "${{ needs.asamon-node.outputs.version }}" \
            --arch "${{ matrix.arch }}" \
            --basis "${{ matrix.kurz }}" \
            --rx build/deb/asamon-rx \
            --node "node-binaries/asamon-node-linux-${{ matrix.arch }}" \
            --out dist

      - name: Gegenprobe — installiert sich das Paket?
        run: |
          apt-get install -y -qq ./dist/*.deb
          asamon-rx --version
          asamon-node --version
          test -x /usr/bin/asamon-rx
          test -f /lib/systemd/system/asamon-node.service
          grep -q 'ExecStart=/usr/bin/asamon-node' /lib/systemd/system/asamon-node.service

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.kurz }}-${{ matrix.arch }}
          path: dist/*.deb

  # --- Release: alles einsammeln, Prüfsummen, veröffentlichen -----------------
  release:
    needs: [asamon-node, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: eingesammelt

      - name: Zusammenstellen und prüfsummen
        run: |
          mkdir -p release
          find eingesammelt -name '*.tar.gz' -exec cp {} release/ \;
          find eingesammelt -name '*.deb'    -exec cp {} release/ \;
          find eingesammelt -name 'QUELLEN.txt' -exec cp {} release/ \;
          cd release
          # Ein gemeinsames SHA256SUMS über alles. install.sh prüft das Paket
          # dagegen, bevor es als root installiert wird — die Datei ist Teil
          # des Sicherheitsversprechens, nicht Beiwerk.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## ASA-Monitor ${{ needs.asamon-node.outputs.version }}

            ### Einrichten oder aktualisieren

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh -o install.sh
            less install.sh          # bitte vorher lesen, es läuft als root
            sudo sh install.sh
            ```

            Das Skript lädt das passende Paket, prüft es gegen `SHA256SUMS`,
            installiert es samt Abhängigkeiten, fragt die Konfiguration ab und
            startet den Dienst. Ist der ASA-Monitor schon installiert, wird
            aktualisiert und die Konfiguration bleibt unangetastet.

            ### Pakete

            | Gerät | Paket |
            |---|---|
            | Raspberry Pi 3/4/5 mit Pi OS 13 (trixie) | `asamon_*_deb13_arm64.deb` |
            | Raspberry Pi 3/4/5 mit Pi OS 12 (bookworm) | `asamon_*_deb12_arm64.deb` |
            | PC mit Debian 13 / Ubuntu | `asamon_*_deb13_amd64.deb` |
            | PC mit Debian 12 | `asamon_*_deb12_amd64.deb` |

            Das Paket enthält **beide** Programme, die systemd-Unit, die
            udev-Regel für den RTL-SDR-Stick und das Blacklisting des
            DVB-T-Treibers.

            32-bit-Pi-OS (armhf) wird nicht ausgeliefert — dort ist selbst zu
            bauen (`asamon-rx/README.md`).

            ### Nur der Knoten, ohne Paket

            `asamon-node-*.tar.gz` enthält den Knotenprozess einzeln, statisch
            gebaut, auch für Windows. Der Empfangsprozess `asamon-rx` ist darin
            **nicht** enthalten.

            Prüfen: `sha256sum -c SHA256SUMS`

            Quellen und Lizenzangaben: `QUELLEN.txt`.
